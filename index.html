<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Minhas Tarefas</h1>

      <form class="form-tarefa" id="formTarefa">
        <input
          type="text"
          id="inputTarefa"
          placeholder="Digite uma tarefa"
          aria-label="Digite uma tarefa"
        />
        <button type="submit" class="btn-add">Adicionar</button>
      </form>

      <div class="controles-multiplos">
        <label class="selecionar-tudo">
          <input type="checkbox" id="selecionarTudo" />
          Selecionar tudo
        </label>
        <button type="button" id="btnExcluirSelecionadas" class="btn-excluir-multiplo">Excluir selecionadas</button>
      </div>

      <ul id="listaTarefas"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
